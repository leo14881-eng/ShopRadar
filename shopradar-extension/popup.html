<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopRadar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d0d0f;
      color: #e8e8ed;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(165deg, #121218 0%, #0d0d0f 45%, #0a0a0c 100%);
    }

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, #f0f0f5 0%, #a8a8b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-indicator {
      position: relative;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3d9eff;
      box-shadow: 0 0 12px rgba(61, 158, 255, 0.6);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-indicator::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: rgba(61, 158, 255, 0.35);
      animation: breathe 2.2s ease-in-out infinite;
    }

    .status-indicator.success {
      background: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.55);
    }

    .status-indicator.success::before {
      background: rgba(52, 211, 153, 0.35);
    }

    .status-indicator.fail {
      background: #f87171;
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
    }

    .status-indicator.fail::before {
      background: rgba(248, 113, 113, 0.35);
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.85);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.85;
      }
    }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 22px;
      text-align: center;
      overflow: hidden;
    }

    .content.has-products {
      align-items: stretch;
      justify-content: flex-start;
      padding: 10px 0 0;
      text-align: left;
    }

    .state-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      animation: fadeIn 0.35s ease;
    }

    .state-panel.active {
      display: flex;
    }

    .state-panel.state-success.active {
      flex: 1 1 auto;
      min-height: 0;
      align-items: stretch;
      gap: 8px;
      padding: 0 16px 4px;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #3d9eff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    .spinner.small {
      width: 24px;
      height: 24px;
      border-width: 2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .state-text {
      font-size: 14px;
      line-height: 1.55;
      color: #9a9aa8;
    }

    .state-text strong {
      color: #e8e8ed;
      font-weight: 500;
    }

    .success-header {
      text-align: center;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .state-success .emoji {
      font-size: 22px;
      line-height: 1;
    }

    .state-success .state-text {
      font-size: 12px;
      color: #6ee7a0;
      margin-top: 2px;
    }

    .domain-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Monaco, monospace;
      color: #b8d4ff;
      background: rgba(61, 158, 255, 0.12);
      border: 1px solid rgba(61, 158, 255, 0.25);
      border-radius: 8px;
      word-break: break-all;
      max-width: 100%;
    }

    .products-section {
      flex: 1 1 auto;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      margin-top: 2px;
      overflow: hidden;
    }

    .products-section-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b6b78;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .products-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 0;
      color: #9a9aa8;
      font-size: 12px;
    }

    .products-empty {
      display: none;
      text-align: center;
      padding: 28px 12px;
      font-size: 13px;
      color: #9a9aa8;
      line-height: 1.6;
    }

    .products-empty.visible {
      display: block;
    }

    #product-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    #product-list::-webkit-scrollbar {
      width: 5px;
    }

    #product-list::-webkit-scrollbar-track {
      background: transparent;
    }

    #product-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    #product-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .product-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .product-item:last-child {
      border-bottom: none;
    }

    .product-thumb {
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: #1a1a22;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .product-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .product-title {
      font-size: 13px;
      font-weight: 500;
      color: #e8e8ed;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .product-meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .product-prices {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
      max-width: 55%;
    }

    .product-compare-price {
      font-size: 10px;
      font-weight: 500;
      color: #7a7a88;
      text-decoration: line-through;
      white-space: nowrap;
    }

    .product-date {
      color: #7a7a88;
    }

    .product-price {
      font-weight: 600;
      color: #6ee7a0;
      white-space: nowrap;
    }


    .state-fail .emoji {
      font-size: 36px;
    }

    .state-fail .state-text {
      color: #f0a0a8;
    }

    .content.pro-summary-only,
    .content.idle-browse-mode {
      justify-content: center;
      padding: 24px 20px;
    }

    .content.pro-summary-only .state-panel,
    .content.idle-browse-mode .state-panel {
      display: none !important;
    }

    .idle-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
      animation: fadeIn 0.35s ease;
    }

    .idle-hero.hidden {
      display: none;
    }

    .idle-hero-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      line-height: 1;
      background: linear-gradient(145deg, rgba(61, 158, 255, 0.2) 0%, rgba(99, 102, 241, 0.12) 100%);
      border: 1px solid rgba(96, 165, 250, 0.35);
      box-shadow: 0 8px 24px rgba(61, 158, 255, 0.1);
    }

    .idle-hero-icon--pro {
      background: linear-gradient(145deg, rgba(52, 211, 153, 0.18) 0%, rgba(61, 158, 255, 0.12) 100%);
      border-color: rgba(52, 211, 153, 0.35);
      box-shadow: 0 8px 24px rgba(52, 211, 153, 0.12);
    }

    .idle-hero-icon--neutral {
      background: linear-gradient(145deg, rgba(61, 158, 255, 0.2) 0%, rgba(99, 102, 241, 0.12) 100%);
      border-color: rgba(96, 165, 250, 0.35);
    }

    .idle-hero-icon--permission {
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.16) 0%, rgba(245, 158, 11, 0.1) 100%);
      border-color: rgba(251, 191, 36, 0.35);
      box-shadow: 0 8px 24px rgba(251, 191, 36, 0.08);
    }

    .idle-hero-icon--reload {
      background: linear-gradient(145deg, rgba(167, 139, 250, 0.18) 0%, rgba(99, 102, 241, 0.12) 100%);
      border-color: rgba(167, 139, 250, 0.35);
    }

    .idle-hero-title {
      font-size: 17px;
      font-weight: 600;
      color: #f0f0f5;
      letter-spacing: 0.02em;
    }

    .idle-hero-desc {
      font-size: 13px;
      line-height: 1.55;
      color: #8a8a98;
      max-width: 260px;
    }

    .idle-hero-domain {
      font-size: 11px;
      line-height: 1.4;
      color: #6b7280;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .idle-hero-domain.hidden {
      display: none;
    }

    .idle-hero-action {
      margin-top: 4px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
      color: #0b0b0f;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(34, 211, 238, 0.25);
    }

    .idle-hero-action:hover {
      filter: brightness(1.06);
    }

    .idle-hero-action.hidden {
      display: none;
    }

    .status-indicator.neutral {
      background: #60a5fa;
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.5);
    }

    .status-indicator.neutral::before {
      background: rgba(96, 165, 250, 0.35);
    }

    .panel-footer {
      flex-shrink: 0;
      margin-top: auto;
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(8, 8, 10, 0.92);
    }

    .account-card {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
    }

    .account-row + .account-row {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .account-row-device {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .account-row-device:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .account-label {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 500;
      color: #6b6b78;
      letter-spacing: 0.04em;
    }

    .account-value {
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }

    .account-value.pro-status-on {
      color: #6ee7a0;
    }

    .account-value.pro-status-off {
      color: #9a9aa8;
    }

    .account-device-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .account-device-id {
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Monaco, monospace;
      font-size: 10px;
      color: #b8b8c4;
      word-break: break-all;
      text-align: right;
      line-height: 1.35;
      max-width: 100%;
    }

    .account-copy-hint {
      font-size: 9px;
      color: #5a5a68;
    }

    .api-env-bar {
      flex-shrink: 0;
      margin: 0 0 8px;
      padding: 0 2px;
      font-size: 10px;
      line-height: 1.4;
      color: #fbbf24;
    }

    .api-env-bar.hidden {
      display: none;
    }

    .footer {
      flex-shrink: 0;
      padding: 10px 0 0;
    }

    .pro-status-bar {
      display: none;
    }

    .device-id-bar {
      display: none;
    }

    #export-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #0d0d0f;
      background: linear-gradient(135deg, #6ee7a0 0%, #3d9eff 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(62, 158, 255, 0.25);
    }

    #export-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #export-btn.is-success {
      background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
    }

    .footer-export.hidden {
      display: none;
    }

    .pro-mask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      padding: 20px;
    }

    .pro-mask.visible {
      display: flex;
    }

    .pro-mask-card {
      width: 100%;
      max-width: 300px;
      padding: 24px 20px;
      border-radius: 14px;
      background: #16161c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .pro-mask-card h2 {
      font-size: 16px;
      margin: 12px 0 8px;
    }

    .pro-mask-card p {
      font-size: 12px;
      color: #a0a0ac;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    #unlock-pro-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      color: #0d0d0f;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }

    #refresh-pro-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #3a3a48;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      color: #d4d4dc;
      background: transparent;
    }

    #refresh-pro-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .claim-pro-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .claim-pro-label {
      font-size: 11px;
      color: #8a8a98;
      margin: 0 0 8px;
      text-align: center;
    }

    #claim-pro-email {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #3a3a48;
      border-radius: 8px;
      font-size: 13px;
      color: #e8e8ee;
      background: #0f0f14;
    }

    #claim-pro-email:focus {
      outline: none;
      border-color: #f59e0b;
    }

    #claim-pro-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid #3a3a48;
      border-radius: 10px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      color: #d4d4dc;
      background: transparent;
    }

    #claim-pro-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #claim-pro-msg {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    #claim-pro-msg.hidden {
      display: none;
    }

    #claim-pro-msg.is-error {
      color: #f87171;
    }

    #claim-pro-msg.is-success {
      color: #86efac;
    }

    .dashboard-link {
      flex-shrink: 0;
      display: block;
      margin: 0;
      padding: 4px 16px 0;
      font-size: 11px;
      line-height: 1.4;
      color: #22d3ee;
      text-decoration: none;
      text-align: center;
    }

    .dashboard-link:hover {
      color: #67e8f9;
      text-decoration: underline;
    }

    .grant-access-btn {
      margin-top: 14px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #22d3ee;
      color: #0b0b0f;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .grant-access-btn:hover {
      background: #67e8f9;
    }

    .grant-access-btn.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header-title">ShopRadar</h1>
      <span class="status-indicator" id="statusIndicator" title="Detecting"></span>
    </header>

    <main class="content" id="mainContent">
      <section id="idleHero" class="idle-hero hidden" aria-hidden="true">
        <div class="idle-hero-icon idle-hero-icon--neutral" aria-hidden="true">🛍</div>
        <p class="idle-hero-title" id="idleHeroTitle">Ready</p>
        <p class="idle-hero-desc" id="idleHeroDesc">
          Open any Shopify / SFCC store to browse products and export to Excel.
        </p>
        <p class="idle-hero-domain hidden" id="idleHeroDomain"></p>
        <button type="button" id="grant-access-btn" class="idle-hero-action hidden">
          Allow access to this site
        </button>
      </section>

      <div class="state-panel state-loading active" id="stateLoading">
        <div class="spinner" aria-hidden="true"></div>
        <p class="state-text" id="loadingText"></p>
      </div>

      <div class="state-panel state-success" id="stateSuccess">
        <div class="success-header">
          <span class="emoji" id="successEmoji" aria-hidden="true"></span>
          <p class="state-text"><strong id="successTitle"></strong></p>
          <span class="domain-badge" id="shopDomain">—</span>
        </div>

        <section class="products-section" id="productsSection">
          <h2 class="products-section-title" id="productsSectionTitle"></h2>
          <div class="products-loading" id="productsLoading">
            <div class="spinner small" aria-hidden="true"></div>
            <span id="productsLoadingText"></span>
          </div>
          <p class="products-empty" id="productsEmpty"></p>
          <div id="product-list" role="list"></div>
        </section>
      </div>

      <div class="state-panel state-fail" id="stateFail">
        <span class="emoji" id="failEmoji" aria-hidden="true"></span>
        <p class="state-text"><strong id="failTitle"></strong></p>
      </div>
    </main>

    <div class="panel-footer">
      <p class="api-env-bar hidden" id="api-env-bar" aria-hidden="true"></p>
      <div class="account-card">
        <div class="account-row">
          <span class="account-label" id="account-pro-label">Pro status</span>
          <span id="pro-status-text" class="account-value">—</span>
        </div>
        <div
          class="account-row account-row-device"
          id="device-id-bar"
          title="Click to copy Device ID"
          role="button"
          tabindex="0"
        >
          <span class="account-label">Device ID</span>
          <div class="account-device-wrap">
            <code id="deviceIdText" class="account-device-id">—</code>
            <span class="account-copy-hint" id="account-copy-hint">Tap to copy</span>
          </div>
        </div>
      </div>
      <footer class="footer footer-export hidden" id="export-footer">
        <button type="button" id="export-btn">Export to Excel (Pro)</button>
      </footer>
    </div>
  </div>

  <div id="pro-mask" class="pro-mask" aria-hidden="true" role="dialog" aria-modal="true" inert>
    <div class="pro-mask-card">
      <h2 id="limitOverlayTitle"></h2>
      <p id="limitOverlayDesc"></p>
      <button type="button" id="unlock-pro-btn"></button>
      <button type="button" id="refresh-pro-btn" class="refresh-pro-btn"></button>
      <div class="claim-pro-section">
        <p id="claim-pro-label" class="claim-pro-label">Already paid? Restore Pro with checkout email</p>
        <input type="email" id="claim-pro-email" autocomplete="email" spellcheck="false" />
        <button type="button" id="claim-pro-btn">Restore Pro by email</button>
        <p id="claim-pro-msg" class="claim-pro-msg hidden" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <script src="console-shield.js"></script>
  <script src="extension-config.js"></script>
  <script src="extension-env.js"></script>
  <script src="extension-guard.js"></script>
  <script src="extension-auth.js"></script>
  <script src="shop-permissions.js"></script>
  <script src="shop-processor.js"></script>
