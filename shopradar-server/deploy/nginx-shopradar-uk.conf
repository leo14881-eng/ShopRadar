# ShopRadar 官网静态站点 — shopradar.uk
# 与 api.shopradar.uk（Node API）并列部署

server {
    listen 80;
    listen [::]:80;
    server_name shopradar.uk www.shopradar.uk;

    root /var/www/shopradar-website;
    index index.html;

    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问本地调试配置
    location ~* website-config\.local\.js$ {
        return 404;
    }
}
