# ShopRadar API — Nginx 反向代理模板
# 部署：复制到服务器 /etc/nginx/sites-available/shopradar-api
# 然后：ln -sf ... sites-enabled/  && nginx -t && systemctl reload nginx
#
# 【必改】server_name 为你的 API 二级域名（Cloudflare 已解析到本机公网 IP）
# 示例：api.yourdomain.com

upstream shopradar_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://shopradar_node;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # 真实客户端 IP（Cloudflare / 海外用户经 CF 时可再配 CF-Connecting-IP）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
