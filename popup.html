<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopRadar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d0d0f;
      color: #e8e8ed;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(165deg, #121218 0%, #0d0d0f 45%, #0a0a0c 100%);
    }

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, #f0f0f5 0%, #a8a8b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-indicator {
      position: relative;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3d9eff;
      box-shadow: 0 0 12px rgba(61, 158, 255, 0.6);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-indicator::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: rgba(61, 158, 255, 0.35);
      animation: breathe 2.2s ease-in-out infinite;
    }

    .status-indicator.success {
      background: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.55);
    }

    .status-indicator.success::before {
      background: rgba(52, 211, 153, 0.35);
    }

    .status-indicator.fail {
      background: #f87171;
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
    }

    .status-indicator.fail::before {
      background: rgba(248, 113, 113, 0.35);
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.85);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.85;
      }
    }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 22px;
      text-align: center;
      overflow: hidden;
    }

    .content.has-products {
      align-items: stretch;
      justify-content: flex-start;
      padding: 10px 0 0;
      text-align: left;
    }

    .state-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      animation: fadeIn 0.35s ease;
    }

    .state-panel.active {
      display: flex;
    }

    .state-panel.state-success.active {
      flex: 1 1 auto;
      min-height: 0;
      align-items: stretch;
      gap: 8px;
      padding: 0 16px 4px;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #3d9eff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    .spinner.small {
      width: 24px;
      height: 24px;
      border-width: 2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .state-text {
      font-size: 14px;
      line-height: 1.55;
      color: #9a9aa8;
    }

    .state-text strong {
      color: #e8e8ed;
      font-weight: 500;
    }

    .success-header {
      text-align: center;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .state-success .emoji {
      font-size: 22px;
      line-height: 1;
    }

    .state-success .state-text {
      font-size: 12px;
      color: #6ee7a0;
      margin-top: 2px;
    }

    .domain-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Monaco, monospace;
      color: #b8d4ff;
      background: rgba(61, 158, 255, 0.12);
      border: 1px solid rgba(61, 158, 255, 0.25);
      border-radius: 8px;
      word-break: break-all;
      max-width: 100%;
    }

    .products-section {
      flex: 1 1 auto;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      margin-top: 2px;
      overflow: hidden;
    }

    .products-section-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b6b78;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .products-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 0;
      color: #9a9aa8;
      font-size: 12px;
    }

    .products-empty {
      display: none;
      text-align: center;
      padding: 28px 12px;
      font-size: 13px;
      color: #9a9aa8;
      line-height: 1.6;
    }

    .products-empty.visible {
      display: block;
    }

    #product-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    #product-list::-webkit-scrollbar {
      width: 5px;
    }

    #product-list::-webkit-scrollbar-track {
      background: transparent;
    }

    #product-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    #product-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .product-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .product-item:last-child {
      border-bottom: none;
    }

    .product-thumb {
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: #1a1a22;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .product-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .product-title {
      font-size: 13px;
      font-weight: 500;
      color: #e8e8ed;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .product-meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .product-prices {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
      max-width: 55%;
    }

    .product-compare-price {
      font-size: 10px;
      font-weight: 500;
      color: #7a7a88;
      text-decoration: line-through;
      white-space: nowrap;
    }

    .product-date {
      color: #7a7a88;
    }

    .product-price {
      font-weight: 600;
      color: #6ee7a0;
      white-space: nowrap;
    }


    .state-fail .emoji {
      font-size: 36px;
    }

    .state-fail .state-text {
      color: #f0a0a8;
    }

    .panel-footer {
      flex-shrink: 0;
      margin-top: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(10, 10, 12, 0.85);
    }

    .footer {
      flex-shrink: 0;
      padding: 10px 16px 14px;
    }

    #export-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #0d0d0f;
      background: linear-gradient(135deg, #6ee7a0 0%, #3d9eff 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(62, 158, 255, 0.25);
    }

    #export-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #export-btn.is-success {
      background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
    }

    .pro-mask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      padding: 20px;
    }

    .pro-mask.visible {
      display: flex;
    }

    .pro-mask-card {
      width: 100%;
      max-width: 300px;
      padding: 24px 20px;
      border-radius: 14px;
      background: #16161c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .pro-mask-card h2 {
      font-size: 16px;
      margin: 12px 0 8px;
    }

    .pro-mask-card p {
      font-size: 12px;
      color: #a0a0ac;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    #unlock-pro-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      color: #0d0d0f;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }

    .device-id-bar {
      flex-shrink: 0;
      margin: 0;
      padding: 6px 16px 0;
      font-size: 10px;
      line-height: 1.4;
      color: #6a6a78;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .device-id-bar code {
      color: #8a8a98;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header-title">ShopRadar</h1>
      <span class="status-indicator" id="statusIndicator" title="检测中"></span>
    </header>

    <main class="content" id="mainContent">
      <div class="state-panel state-loading active" id="stateLoading">
        <div class="spinner" aria-hidden="true"></div>
        <p class="state-text" id="loadingText"></p>
      </div>

      <div class="state-panel state-success" id="stateSuccess">
        <div class="success-header">
          <span class="emoji" id="successEmoji" aria-hidden="true"></span>
          <p class="state-text"><strong id="successTitle"></strong></p>
          <span class="domain-badge" id="shopDomain">—</span>
        </div>

        <section class="products-section" id="productsSection">
          <h2 class="products-section-title" id="productsSectionTitle"></h2>
          <div class="products-loading" id="productsLoading">
            <div class="spinner small" aria-hidden="true"></div>
            <span id="productsLoadingText"></span>
          </div>
          <p class="products-empty" id="productsEmpty"></p>
          <div id="product-list" role="list"></div>
        </section>
      </div>

      <div class="state-panel state-fail" id="stateFail">
        <span class="emoji" id="failEmoji" aria-hidden="true"></span>
        <p class="state-text"><strong id="failTitle"></strong></p>
      </div>
    </main>

    <div class="panel-footer">
      <p class="device-id-bar" id="device-id-bar" title="点击复制 Device ID">
        Device ID: <code id="deviceIdText">—</code>
      </p>
      <footer class="footer">
        <button type="button" id="export-btn">一键导出 CSV (Pro)</button>
      </footer>
    </div>
  </div>

  <div id="pro-mask" class="pro-mask" aria-hidden="true" role="dialog" aria-modal="true" inert>
    <div class="pro-mask-card">
      <h2 id="limitOverlayTitle"></h2>
      <p id="limitOverlayDesc"></p>
      <button type="button" id="unlock-pro-btn"></button>
    </div>
  </div>

  <script src="extension-config.js"></script>
  <script src="extension-guard.js"></script>
  <script src="shop-processor.js"></script>
  <script src="shop-url.js"></script>
  <script src="detection-cache.js"></script>
  <script src="store-detect.js"></script>
  <script src="lemon-checkout.config.js"></script>
  <script src="lemon-payment-return.js"></script>
  <script src="popup.js"></script>
</body>
</html>
